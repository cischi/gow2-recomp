# XenonRecomp configuration for Gears of War 2 (default.xex, base 0x82000000).
# XenonRecomp resolves relative paths against the folder of this file.

[main]
file_path = "../game_data/default.xex"
out_directory_path = "../build/generated"
switch_table_file_path = "gow2_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers: output of
#   python tools/find_helpers.py build/xex/image.bin build/xex/info.json
savegprlr_14_address = 0x82A930A0
restgprlr_14_address = 0x82A930F0
savefpr_14_address = 0x82A93400
restfpr_14_address = 0x82A9344C
savevmx_14_address = 0x82A94250
restvmx_14_address = 0x82A944E8
savevmx_64_address = 0x82A942E4
restvmx_64_address = 0x82A9457C

# CRT setjmp/longjmp, found by searching for the routines that save and restore
# f14-f31, r13-r31, v64-v127, LR (+308), CR (+304) and r1 (+144) in the buffer pointed to by r3.
# setjmp: mflr r0 / mfcr r4 / stfd f14,0(r3) ... / std r1,144(r3) / li r3,0 / blr
# longjmp: lfd f14,0(r7) ... / lwz r5,308(r7) / mtlr r5 / ld r1,144(r7) / mr r3,r6 / blr
setjmp_address = 0x82A93D90
longjmp_address = 0x82A93950

# Data (not code) to skip in the linear scan of .text. Every function
# with exception handling is preceded by 8 bytes: the pointer to the handler
# and the pointer to its scope data. XenonRecomp used to decode them as code
# (lwz ...) and the resulting fragment swallowed the real following function
# (known from .pdata), with switches outside functions and unresolved jumps. The three words
# appear in .text only at this position (722 + 57 + 1 times, always 8
# bytes from a .pdata start), so skipping them does not hide code.
invalid_instructions = [
    { data = 0x82CD5760, size = 8 }, # C++ handler (__CxxFrameHandler) + scope table
    { data = 0x82F4D43C, size = 8 }, # __C_specific_handler thunk (xboxkrnl, ordinal 421) + scope table
    { data = 0x82CD7F80, size = 8 }, # third handler, a single use + scope table
]

# Function boundaries corrected by hand (generated with a
# recursive-descent analysis that also follows the switch tables of gow2_switch_tables.toml).
#
# 1) Functions with switches not covered by .pdata: XenonRecomp's Function::Analyze
#    does not know jump tables and closes the function at the bctr, so the cases
#    ended up in separate functions ("Switch case ... is trying to jump outside
#    function"). The size moves the end of the function past the last case.
# 2) A thunk that jumps into the following function: Function::Analyze followed
#    the jump and the fragment swallowed the other function with its switch.
# 3) Functions truncated by Function::Analyze or by .pdata, which left jumps
#    (b) to addresses that are not function starts ("// ERROR <addr>" in the
#    generated C++).
# 4) Functions without .pdata with an inline switch (table right after the bctr,
#    without a cmplwi/bgt before it): the linear scan closed the function at the bctr and
#    decoded the table as code, swallowing the first case. Output of
#      python tools/find_missing_functions.py build/xex/image.bin build/xex/info.json
#        build/generated/ppc_func_mapping.cpp --switch-tables config/gow2_switch_tables.toml
