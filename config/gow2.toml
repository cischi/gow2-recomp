# Game patches (runtime/game_patches): hooks before the instruction; true = the original lwz is skipped (li reg,0).
[[midasm_hook]]
name = "Gow2PatchMotionBlur" # lwz r11,0x2C(r10)
address = 0x8236004C
registers = ["r11"]
jump_address_on_true = 0x82360050

[[midasm_hook]]
name = "Gow2PatchLensFlares" # lwz r10,0x48(r11)
address = 0x827B817C
registers = ["r10"]
jump_address_on_true = 0x827B8180

[[midasm_hook]]
name = "Gow2PatchBloom1" # lwz r10,0x38(r10)
address = 0x824ECEF8
registers = ["r10"]
jump_address_on_true = 0x824ECEFC

[[midasm_hook]]
name = "Gow2PatchBloom2" # lwz r11,0x38(r10)
address = 0x824ED078
registers = ["r11"]
jump_address_on_true = 0x824ED07C

[[midasm_hook]]
