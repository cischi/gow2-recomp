jump_address_on_true = 0x824ED0A8


# Frame rate (internal patches, [game] frame_rate): present interval and Unlock FPS (illusion, boma).
[[midasm_hook]]
name = "Gow2PatchPresentInterval" # li r11,2
address = 0x8298CFB0
registers = ["r11"]
jump_address_on_true = 0x8298CFB4

[[midasm_hook]]
name = "Gow2PatchUnlockFps" # lfs f1,0x504(r3)
address = 0x824A2E94
registers = ["f1"]
jump_address_on_true = 0x824A2E98

# Engine configuration (internal patch coalesced.no_hash_check, from [engine]):
# "Disable Coalesced Hash Check" (Sowa_95, boma).
[[midasm_hook]]
name = "Gow2PatchCoalescedHash1" # li r3,1
address = 0x82AA8904
registers = ["r3"]
jump_address_on_true = 0x82AA8908

[[midasm_hook]]
name = "Gow2PatchCoalescedHash2" # mflr r12, first instruction: true = blr
address = 0x827F9148
registers = []
return_on_true = true

# Aspect ratio (internal patches, [video] aspect): 21:9 by boma, TudorHorse; 16:10 at 1280x800 (ratio and ConstrainAspectRatio by boma, TudorHorse).
[[midasm_hook]]
name = "Gow2PatchNoConstrainAspect" # beq cr6,0x8252D69C: true = always jump (common to 21:9 and 16:10)
address = 0x8252D608
registers = []
jump_address_on_true = 0x8252D69C

[[midasm_hook]]
name = "Gow2PatchUwFov" # lfs f0,0x408(r7): f0 from the tangent, f30 = FOV in degrees
address = 0x8252D73C
registers = ["f0", "f30"]
jump_address_on_true = 0x8252D740

[[midasm_hook]]
name = "Gow2PatchSceneHeight" # li r11,720: 550 at 21:9, 800 at 16:10 (common to both entries)
address = 0x82806B10
registers = ["r11"]
jump_address_on_true = 0x82806B14

[[midasm_hook]]
name = "Gow2PatchUwUiHeight" # lwz r7,12(r8); mtctr r7; bctrl
address = 0x826E3720
registers = ["r3"]
jump_address_on_true = 0x826E372C
